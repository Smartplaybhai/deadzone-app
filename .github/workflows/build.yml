name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug assembleRelease --no-daemon
      - run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/DEADZONE-TEST-ads.apk
          cp app/build/outputs/apk/release/app-release.apk out/DEADZONE-REAL-ads.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DEADZONE-APKs
          path: out/*.apk
      - name: Publish TEST apk as public download (Google test ads, safe to tap)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest TEST build
          body: Google TEST ads only. Safe to tap.
          files: out/DEADZONE-TEST-ads.apk
          prerelease: true
